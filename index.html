<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffd9df">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuschelpfote">
<title>Hotel Kuschelpfote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }</script>
<script>window.__errors = []; window.addEventListener('error', (e) => window.__errors.push(String(e.message || e))); window.addEventListener('unhandledrejection', (e) => window.__errors.push('promise: ' + String(e.reason && (e.reason.stack || e.reason.message) || e.reason)));</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay"></div>
<div id="ui">
  <div id="hud" class="hidden">
    <button id="bMenu" class="round" aria-label="Menü">☰</button>
    <div id="coins" class="pill"><span class="ico">🪙</span><b id="coinN">0</b></div>
    <div id="stars" class="pill"><span id="starRow"></span><i id="starBar"><i></i></i></div>
    <div id="worldName" class="pill"></div>
  </div>
  <div id="camBtns" class="hidden">
    <button id="bRotL" class="round" aria-label="Nach links drehen">⟲</button>
    <button id="bRotR" class="round" aria-label="Nach rechts drehen">⟳</button>
    <div id="lvl" class="hidden"><button id="bUp" class="round" aria-label="Etage hoch">▲</button><span id="lvlN" class="pill">EG</span><button id="bDown" class="round" aria-label="Etage runter">▼</button></div>
  </div>
  <div id="bar" class="hidden">
    <button id="bFloor" class="big"><span>🏗️</span><small>Anbau</small></button>
    <button id="bTrip" class="big"><span>🧺</span><small>Ausflug</small></button>
    <button id="bAlbum" class="big"><span>📖</span><small>Album</small></button>
    <button id="bWorlds" class="big"><span>🌍</span><small>Welten</small></button>
  </div>
  <div id="furnish" class="hidden">
    <div id="fTop">
      <button id="fUndo" class="big" aria-label="Rückgängig"><span>↩️</span><small>Zurück</small></button>
      <button id="fWall" class="big" aria-label="Tapete"><span>🖼️</span><small>Tapete</small></button>
      <div id="fTitle" class="pill"></div>
      <button id="fDone" class="big ok" aria-label="Fertig"><span>✔️</span><small>Fertig</small></button>
    </div>
    <div id="fSel" class="hidden">
      <button id="sRot" class="big"><span>🔄</span><small>Drehen</small></button>
      <button id="sCol" class="big"><span>🎨</span><small>Farbe</small></button>
      <button id="sDel" class="big"><span>🗑️</span><small>Weg</small></button>
      <div id="palette" class="hidden"></div>
    </div>
    <div id="catalog">
      <div id="cTabs"></div>
      <div id="cList"></div>
    </div>
  </div>
  <div id="trip" class="hidden"><div id="tripTime"><i></i></div><div id="tripCount" class="pill">⭐ 0</div><div id="tripHint"></div></div>
  <div id="toasts"></div>
  <div id="modal" class="hidden"><div class="card"></div></div>
  <div id="tut" class="hidden"></div>
  <div id="start" class="hidden"></div>
  <div id="loading"><div class="paw">🐾</div><div>Hotel Kuschelpfote</div><div id="loadBar"><i></i></div></div>
</div>

</body>
</html>
